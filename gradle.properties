# Version fields. Fixed values, set manually only when the project
# genuinely moves to a new version. Never bumped as a side effect of an
# unrelated change. Only the owner changes these fields.
nexusVersion=0.1.0
versionSuffix=alpha

# Supported on nexusVersion=0.1.0: 26.1, 26.2, 26.3

# versionSuffix meanings. Blank for a clean stable release (0.1.0).
# alpha for a pre-release build (0.1.0-alpha). Pre-release builds are
# only offered as updates to servers already running a pre-release.
# The published GitHub release tag always equals the full version.
# There is no auto-increment, each build uses exactly what is written.

# Build and toolchain settings.
org.gradle.jvmargs=--enable-native-access=ALL-UNNAMED
org.gradle.java.installations.auto-download=true
targetJavaVersion=25
