version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "NEXUS:main(chore)"
    labels:
      - dependencies
  - package-ecosystem: gradle
    directories:
      - /
      - /common
      - /paper
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "NEXUS:main(chore)"
    labels:
      - dependencies
