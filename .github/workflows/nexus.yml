name: Zellys Nexus

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'images/**'
      - '.gitignore'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'images/**'
      - '.gitignore'
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, blank to use gradle.properties (e.g. 0.1.0 or 0.1.0-alpha)"
        required: false
      mode:
        description: "dry-run builds and previews, publish creates the GitHub Release, cancel does nothing"
        type: choice
        options:
          - dry-run
          - publish
          - cancel
        default: dry-run

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    outputs:
      plugin_version: ${{ steps.meta.outputs.plugin_version }}
      latest_mc: ${{ steps.meta.outputs.latest_mc }}
      mc_range: ${{ steps.meta.outputs.mc_range }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve plugin metadata and Minecraft targets
        id: meta
        run: |
          PROPS="gradle.properties"
          BASE_VER=$(grep -E '^[[:space:]]*nexusVersion=' "$PROPS" | cut -d'=' -f2 | tr -d '[:space:]')
          SUFFIX=$(grep -E '^[[:space:]]*versionSuffix=' "$PROPS" | cut -d'=' -f2 | tr -d '[:space:]')
          if [ -n "$SUFFIX" ]; then
            PLUGIN_VER="${BASE_VER}-${SUFFIX}"
          else
            PLUGIN_VER="${BASE_VER}"
          fi

          MC_LINE=$(grep -E '^[[:space:]]*#[[:space:]]*Supported on nexusVersion' "$PROPS" | head -1)
          MC_LIST=$(echo "$MC_LINE" | cut -d':' -f2 | tr -d ' ')
          LATEST_MC=$(echo "$MC_LIST" | awk -F',' '{print $NF}')
          FIRST_MC=$(echo "$MC_LIST" | awk -F',' '{print $1}')
          MC_RANGE="${FIRST_MC} - ${LATEST_MC}"

          echo "plugin_version=${PLUGIN_VER}" >> "$GITHUB_OUTPUT"
          echo "latest_mc=${LATEST_MC}" >> "$GITHUB_OUTPUT"
          echo "mc_range=${MC_RANGE}" >> "$GITHUB_OUTPUT"

          echo "Zellys Nexus CI: Build and Test"
          echo "Current Plugin Version:          ${PLUGIN_VER}"
          echo "Latest Supported Minecraft:      ${LATEST_MC}"
          echo "Declared Minecraft Range:        ${MC_RANGE}"
          echo "Java Target:                     Bytecode 25 (JDK 25 Toolchain)"
          echo "Branch / Ref:                    ${GITHUB_REF_NAME}"
          echo "Commit SHA:                      ${GITHUB_SHA}"

          cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          # Zellys Nexus CI Summary

          | Property | Value |
          | :--- | :--- |
          EOF
          echo "| **Current Plugin Version** | \`${PLUGIN_VER}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Latest Supported Minecraft** | \`${LATEST_MC}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Supported Minecraft Range** | \`${MC_RANGE}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Java Toolchain** | JDK 25 (Bytecode target 25) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Platform Target** | Paper Family (Paper, Purpur, Folia) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Ref / Commit** | \`${GITHUB_REF_NAME}\` (\`${GITHUB_SHA:0:8}\`) |" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build and execute test suite
        run: ./gradlew build --no-daemon

      - name: Publish build success to summary
        if: success()
        run: |
          cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"

          ### Build and Test Status: Succeeded
          - All Gradle subprojects (:common, :paper) built and verified cleanly.
          - JUnit test suites for :common and :paper executed without errors.
          EOF

      - name: Generate version commit summary
        id: version_commits
        run: |
          python3 .github/scripts/generate_version_commits.py

      - name: Upload version commit report
        uses: actions/upload-artifact@v7
        with:
          name: version-commits-${{ steps.meta.outputs.plugin_version }}
          path: build/reports/version-commits.md
          retention-days: 7

      - name: Upload compiled shadow JAR artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ZellysNexus-build-${{ steps.meta.outputs.plugin_version }}
          path: paper/build/libs/ZellysNexus-${{ steps.meta.outputs.plugin_version }}.jar
          retention-days: 7

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            paper/build/reports/tests/test/
            common/build/reports/tests/test/
          retention-days: 7

  dependency-audit:
    name: Dependency and Integrations Audit
    needs: [ build-and-test ]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Execute version audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x .github/scripts/audit_dependencies.py
          python3 .github/scripts/audit_dependencies.py

  standards-validation:
    name: Validate Standards
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate commit convention
        run: |
          echo "Validating commit messages against NEXUS:<branch>(<type>): <description> convention..."
          REGEX="^NEXUS:(main|[a-zA-Z0-9_.-]+)\((fix|add|feat|refactor|docs|chore)\):\s.+"
          FAILED=0

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            COMMITS=$(git log --format="%s" origin/main..HEAD)
          else
            COMMITS=$(git log -1 --format="%s")
          fi

          while IFS= read -r msg; do
            [ -z "$msg" ] && continue
            if ! echo "$msg" | grep -qE "$REGEX"; then
              echo "ERROR: Commit message does not follow convention: '$msg'"
              echo "Required format: NEXUS:<branch>(<type>): <description>"
              echo "Valid types: fix, add, feat, refactor, docs, chore"
              FAILED=1
            fi
          done <<< "$COMMITS"

          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi
          echo "All commit messages comply with repository convention."

      - name: Validate version field integrity
        if: github.event_name == 'pull_request'
        run: |
          echo "Verifying gradle.properties version immutability..."
          if git diff origin/main..HEAD -- gradle.properties | grep -qE '^\+[ ]*(nexusVersion|versionSuffix)='; then
            echo "ERROR: gradle.properties version fields were modified."
            echo "Rule: Plugin release version numbers and tags are managed exclusively by the maintainer."
            echo "Please revert modifications to nexusVersion and versionSuffix."
            exit 1
          fi
          echo "Version field integrity verified."

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check headers, translations, YAML and typography
        run: |
          python3 -m pip install --quiet pyyaml
          python3 .github/scripts/check_sources.py

      - name: Validate absence of placeholder markers
        run: |
          echo "Verifying absence of placeholder markers (TODO, FIXME) in Java source files..."
          FAILED=0
          if grep -rnE --include="*.java" '//\s*(TODO|FIXME|XXX)' paper/src common/src; then
            echo "ERROR: Stand-in placeholder markers found in source code."
            echo "Rule: Files must contain finished, tested code only without TODO or FIXME comments."
            FAILED=1
          fi

          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi
          echo "No placeholder markers detected in Java sources."

      - name: Publish governance validation summary
        if: always()
        run: |
          cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## Governance and Standards Validation Summary

          | Standard | Rule / Target | Status |
          | :--- | :--- | :---: |
          | **Commit Convention** | `NEXUS:<branch>(<type>): <summary>` | Passed |
          | **Version Immutability** | `nexusVersion` / `versionSuffix` integrity | Passed |
          | **Source Checks** | Headers, translation parity, YAML syntax, typography | Passed |
          | **Code Integrity** | Zero placeholder markers (`TODO`, `FIXME`, `XXX`) | Passed |
          EOF

  release-prepare:
    name: Prepare Release
    if: github.event_name == 'workflow_dispatch' && inputs.mode != 'cancel'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      dev_build: ${{ steps.meta.outputs.dev_build }}
      game_versions: ${{ steps.meta.outputs.game_versions }}
      jar_name: ${{ steps.stage.outputs.jar_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version and channel
        id: meta
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          PROPS="gradle.properties"
          BASE_VER=$(grep -E '^[[:space:]]*nexusVersion=' "$PROPS" | cut -d'=' -f2 | tr -d '[:space:]')
          SUFFIX=$(grep -E '^[[:space:]]*versionSuffix=' "$PROPS" | cut -d'=' -f2 | tr -d '[:space:]')
          BUILT="${BASE_VER}${SUFFIX:+-$SUFFIX}"
          VERSION="${VERSION_INPUT:-$BUILT}"
          if [ "$VERSION" != "$BUILT" ]; then
            echo "::error::Requested version $VERSION does not match gradle.properties ($BUILT)."
            exit 1
          fi
          if echo "$SUFFIX" | grep -qiE '(alpha|beta|rc|dev|snapshot|bedev|exp)'; then
            DEV_BUILD=true
          else
            DEV_BUILD=false
          fi
          GAMES=$(grep -E '^[[:space:]]*#[[:space:]]*Supported on nexusVersion' "$PROPS" | head -1 | cut -d':' -f2 | tr -d ' \r' | jq -Rc 'split(",")')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "base=$BASE_VER" >> "$GITHUB_OUTPUT"
          echo "game_versions=$GAMES" >> "$GITHUB_OUTPUT"
          echo "dev_build=$DEV_BUILD" >> "$GITHUB_OUTPUT"

      - name: Select release notes
        id: notes
        run: |
          mkdir -p build/reports
          VERSION="${{ steps.meta.outputs.version }}"
          NOTES=""
          for candidate in "DOCS/${VERSION}_CHANGELOG.md" "DOCS/${{ steps.meta.outputs.base }}_CHANGELOG.md"; do
            if [ -f "$candidate" ]; then
              NOTES="$candidate"
              break
            fi
          done
          if [ -n "$NOTES" ]; then
            cp "$NOTES" build/reports/release-notes.md
            echo "source=$NOTES" >> "$GITHUB_OUTPUT"
            echo "url=https://github.com/${{ github.repository }}/blob/${{ github.sha }}/$NOTES" >> "$GITHUB_OUTPUT"
          else
            python3 .github/scripts/generate_version_commits.py --version "$VERSION" --release-body --output-file build/reports/release-notes.md
            echo "source=generated from commit history" >> "$GITHUB_OUTPUT"
            echo "url=" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build plugin, sources and javadoc
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Stage release files
        id: stage
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          mkdir -p build/release
          cp "paper/build/libs/ZellysNexus-${VERSION}.jar" \
             "paper/build/libs/ZellysNexus-${VERSION}-sources.jar" \
             "paper/build/libs/ZellysNexus-${VERSION}-javadoc.jar" \
             build/reports/release-notes.md build/release/
          (cd build/release && sha256sum *.jar > checksums.sha256)
          echo "jar_name=ZellysNexus-${VERSION}.jar" >> "$GITHUB_OUTPUT"
          echo "jar_size=$(ls -lh "build/release/ZellysNexus-${VERSION}.jar" | awk '{print $5}')" >> "$GITHUB_OUTPUT"
          echo "jar_sha=$(sha256sum "build/release/ZellysNexus-${VERSION}.jar" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          ls -la build/release

      - name: Upload staged release files
        uses: actions/upload-artifact@v7
        with:
          name: zellys-nexus-release-${{ steps.meta.outputs.version }}
          path: build/release/
          retention-days: 7

      - name: Write release preview
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          DEV_BUILD: ${{ steps.meta.outputs.dev_build }}
          MODE: ${{ inputs.mode }}
          NOTES_SOURCE: ${{ steps.notes.outputs.source }}
          NOTES_URL: ${{ steps.notes.outputs.url }}
        run: |
          {
            echo "# Release preview: ${VERSION}"
            echo ""
            echo "| Property | Value |"
            echo "| :--- | :--- |"
            echo "| **Version** | \`${VERSION}\` |"
            echo "| **Plugin JAR** | \`${{ steps.stage.outputs.jar_name }}\` (${{ steps.stage.outputs.jar_size }}) |"
            echo "| **SHA-256** | \`${{ steps.stage.outputs.jar_sha }}\` |"
            if [ -n "$NOTES_URL" ]; then
              echo "| **Release notes** | [\`${NOTES_SOURCE}\`](${NOTES_URL}) |"
            else
              echo "| **Release notes** | ${NOTES_SOURCE} |"
            fi
            if [ "$DEV_BUILD" = "true" ]; then
              echo "| **Targets** | GitHub Releases only, as a pre-release (development build) |"
            else
              echo "| **Targets** | GitHub Releases and Modrinth (plugin JAR only, skipped when the version exists or no token is set) |"
            fi
            echo ""
            if [ "$MODE" = "publish" ]; then
              echo "> Publish mode: the release job runs next."
            else
              echo "> Dry run: nothing was uploaded. Run again with mode \`publish\` to release."
            fi
            echo ""
            echo "## Release notes"
            echo ""
            cat build/reports/release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"

  release-publish:
    name: Publish Release
    needs: [ release-prepare ]
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'publish'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      MODRINTH_PROJECT: ${{ vars.MODRINTH_PROJECT_ID || 'zellys-nexus' }}

    steps:
      - name: Download staged release files
        uses: actions/download-artifact@v8
        with:
          name: zellys-nexus-release-${{ needs.release-prepare.outputs.version }}
          path: build/release/

      - name: Create GitHub Release
        id: gh_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: "Zellys Nexus ${{ needs.release-prepare.outputs.version }}"
          body_path: build/release/release-notes.md
          files: |
            build/release/*.jar
            build/release/checksums.sha256
          draft: false
          prerelease: ${{ needs.release-prepare.outputs.dev_build == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Modrinth
        id: modrinth
        if: needs.release-prepare.outputs.dev_build != 'true' && env.MODRINTH_TOKEN != ''
        env:
          VERSION: ${{ needs.release-prepare.outputs.version }}
          GAME_VERSIONS: ${{ needs.release-prepare.outputs.game_versions }}
        run: |
          API="https://api.modrinth.com/v2"
          PROJECT_ID=$(curl -s --fail-with-body -H "Authorization: $MODRINTH_TOKEN" "$API/project/$MODRINTH_PROJECT" | jq -r '.id')
          FOUND=$(curl -s --fail-with-body -H "Authorization: $MODRINTH_TOKEN" "$API/project/$PROJECT_ID/version" \
            | jq --arg v "$VERSION" '[.[] | select(.version_number == $v)] | length')
          if [ "$FOUND" != "0" ]; then
            echo "Modrinth already has $VERSION, skipping the upload."
            echo "status=exists" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          jq -n --arg p "$PROJECT_ID" --arg v "$VERSION" --rawfile notes build/release/release-notes.md --argjson games "$GAME_VERSIONS" \
            '{project_id: $p, version_number: $v, name: ("Zellys Nexus " + $v), changelog: $notes, version_type: "release",
              game_versions: $games, loaders: ["paper", "purpur", "folia"], dependencies: [], featured: true, file_parts: ["file"]}' > modrinth.json
          curl -s --fail-with-body -X POST "$API/version" -H "Authorization: $MODRINTH_TOKEN" \
            -F "data=<modrinth.json;type=application/json" -F "file=@build/release/ZellysNexus-${VERSION}.jar"
          echo "status=uploaded" >> "$GITHUB_OUTPUT"

      - name: Write Discord announcement
        if: always() && steps.gh_release.outcome == 'success'
        env:
          VERSION: ${{ needs.release-prepare.outputs.version }}
          DEV_BUILD: ${{ needs.release-prepare.outputs.dev_build }}
          RELEASE_URL: ${{ steps.gh_release.outputs.url }}
          MODRINTH_STATUS: ${{ steps.modrinth.outputs.status }}
        run: |
          FENCE='```'
          {
            echo "## Discord Announcement"
            echo ""
            echo "**Post title**"
            echo "${FENCE}"
            echo "${VERSION} RELEASE"
            echo "${FENCE}"
            echo "**Tag**"
            echo "${FENCE}"
            echo "V - ${VERSION}"
            echo "${FENCE}"
            echo "**GitHub release**"
            echo "${FENCE}"
            echo "${RELEASE_URL}"
            echo "${FENCE}"
            if [ "$DEV_BUILD" = "true" ]; then
              echo "Pre-release build, published on GitHub only."
            elif [ -n "$MODRINTH_STATUS" ]; then
              echo "**Download platforms**"
              echo "${FENCE}"
              echo "MODRINTH: https://modrinth.com/plugin/${MODRINTH_PROJECT}/version/${VERSION}"
              echo "${FENCE}"
            else
              echo "Modrinth upload did not run, so there are no platform links."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
