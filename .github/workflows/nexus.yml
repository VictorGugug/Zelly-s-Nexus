name: Zellys Nexus

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'images/**'
      - '.gitignore'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'images/**'
      - '.gitignore'
  release:
    types: [ published ]
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to build and publish (e.g. 0.1.0 or 0.1.0-alpha)"
        required: false
      tag:
        description: "Release tag to rebuild and publish (e.g. 0.1.0)"
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-test:
    name: Build and Test
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    outputs:
      plugin_version: ${{ steps.meta.outputs.plugin_version }}
      latest_mc: ${{ steps.meta.outputs.latest_mc }}
      mc_range: ${{ steps.meta.outputs.mc_range }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve plugin metadata and Minecraft targets
        id: meta
        run: |
          PROPS="gradle.properties"
          BASE_VER=$(grep -E '^[[:space:]]*nexusVersion=' "$PROPS" | cut -d'=' -f2 | tr -d '[:space:]')
          SUFFIX=$(grep -E '^[[:space:]]*versionSuffix=' "$PROPS" | cut -d'=' -f2 | tr -d '[:space:]')
          if [ -n "$SUFFIX" ]; then
            PLUGIN_VER="${BASE_VER}-${SUFFIX}"
          else
            PLUGIN_VER="${BASE_VER}"
          fi

          MC_LINE=$(grep -E '^[[:space:]]*#[[:space:]]*Supported on nexusVersion' "$PROPS" | head -1)
          MC_LIST=$(echo "$MC_LINE" | cut -d':' -f2 | tr -d ' ')
          LATEST_MC=$(echo "$MC_LIST" | awk -F',' '{print $NF}')
          FIRST_MC=$(echo "$MC_LIST" | awk -F',' '{print $1}')
          MC_RANGE="${FIRST_MC} - ${LATEST_MC}"

          echo "plugin_version=${PLUGIN_VER}" >> "$GITHUB_OUTPUT"
          echo "latest_mc=${LATEST_MC}" >> "$GITHUB_OUTPUT"
          echo "mc_range=${MC_RANGE}" >> "$GITHUB_OUTPUT"

          echo "Zellys Nexus CI: Build and Test"
          echo "Current Plugin Version:          ${PLUGIN_VER}"
          echo "Latest Supported Minecraft:      ${LATEST_MC}"
          echo "Declared Minecraft Range:        ${MC_RANGE}"
          echo "Java Target:                     Bytecode 25 (JDK 25 Toolchain)"
          echo "Branch / Ref:                    ${GITHUB_REF_NAME}"
          echo "Commit SHA:                      ${GITHUB_SHA}"

          cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          # Zellys Nexus CI Summary

          | Property | Value |
          | :--- | :--- |
          EOF
          echo "| **Current Plugin Version** | \`${PLUGIN_VER}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Latest Supported Minecraft** | \`${LATEST_MC}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Supported Minecraft Range** | \`${MC_RANGE}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Java Toolchain** | JDK 25 (Bytecode target 25) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Platform Target** | Paper Family (Paper, Purpur, Folia) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Ref / Commit** | \`${GITHUB_REF_NAME}\` (\`${GITHUB_SHA:0:8}\`) |" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build and execute test suite
        run: ./gradlew build --no-daemon

      - name: Publish build success to summary
        if: success()
        run: |
          cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"

          ### Build and Test Status: Succeeded
          - All Gradle subprojects (:common, :paper) built and verified cleanly.
          - Paper runtime and MockBukkit test suites executed without errors.
          EOF

      - name: Generate version commit summary
        id: version_commits
        run: |
          python3 .github/scripts/generate_version_commits.py

      - name: Upload version commit report
        uses: actions/upload-artifact@v7
        with:
          name: version-commits-${{ steps.meta.outputs.plugin_version }}
          path: build/reports/version-commits.md
          retention-days: 7

      - name: Upload compiled shadow JAR artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ZellysNexus-build-${{ steps.meta.outputs.plugin_version }}
          path: paper/build/libs/ZellysNexus-*.jar
          retention-days: 7

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            paper/build/reports/tests/test/
            common/build/reports/tests/test/
          retention-days: 7

  dependency-audit:
    name: Dependency and Integrations Audit
    needs: [ build-and-test ]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Execute version audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x .github/scripts/audit_dependencies.py
          python3 .github/scripts/audit_dependencies.py

  standards-validation:
    name: Validate Standards
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate commit convention
        run: |
          echo "Validating commit messages against NEXUS:<branch>(<type>): <description> convention..."
          REGEX="^NEXUS:(main|[a-zA-Z0-9_.-]+)\((fix|add|feat|refactor|docs|chore)\):\s.+"
          FAILED=0

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            COMMITS=$(git log --format="%s" origin/main..HEAD)
          else
            COMMITS=$(git log -1 --format="%s")
          fi

          while IFS= read -r msg; do
            [ -z "$msg" ] && continue
            if ! echo "$msg" | grep -qE "$REGEX"; then
              echo "ERROR: Commit message does not follow convention: '$msg'"
              echo "Required format: NEXUS:<branch>(<type>): <description>"
              echo "Valid types: fix, add, feat, refactor, docs, chore"
              FAILED=1
            fi
          done <<< "$COMMITS"

          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi
          echo "All commit messages comply with repository convention."

      - name: Validate version field integrity
        if: github.event_name == 'pull_request'
        run: |
          echo "Verifying gradle.properties version immutability..."
          if git diff origin/main..HEAD -- gradle.properties | grep -qE '^\+[ ]*(nexusVersion|versionSuffix)='; then
            echo "ERROR: gradle.properties version fields were modified."
            echo "Rule: Plugin release version numbers and tags are managed exclusively by the maintainer."
            echo "Please revert modifications to nexusVersion and versionSuffix."
            exit 1
          fi
          echo "Version field integrity verified."

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check headers, translations, YAML and typography
        run: |
          python3 -m pip install --quiet pyyaml
          python3 .github/scripts/check_sources.py

      - name: Validate absence of placeholder markers
        run: |
          echo "Verifying absence of placeholder markers (TODO, FIXME) in Java source files..."
          FAILED=0
          if grep -rnE --include="*.java" '//\s*(TODO|FIXME|XXX)' paper/src common/src; then
            echo "ERROR: Stand-in placeholder markers found in source code."
            echo "Rule: Files must contain finished, tested code only without TODO or FIXME comments."
            FAILED=1
          fi

          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi
          echo "No placeholder markers detected in Java sources."

      - name: Publish governance validation summary
        if: always()
        run: |
          cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## Governance and Standards Validation Summary

          | Standard | Rule / Target | Status |
          | :--- | :--- | :---: |
          | **Commit Convention** | `NEXUS:<branch>(<type>): <summary>` | Passed |
          | **Version Immutability** | `nexusVersion` / `versionSuffix` integrity | Passed |
          | **Source Checks** | Headers, translation parity, YAML syntax, typography | Passed |
          | **Code Integrity** | Zero placeholder markers (`TODO`, `FIXME`, `XXX`) | Passed |
          EOF

  create-release:
    name: Build and Create GitHub Release
    if: github.event_name == 'workflow_dispatch' && inputs.version != ''
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate version changelog
        id: changelog
        run: |
          python3 .github/scripts/generate_version_commits.py --version "${{ inputs.version }}" --release-body --output-file build/reports/release-notes.md

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build shadow JAR
        run: ./gradlew :paper:shadowJar --no-daemon

      - name: Locate JAR
        id: jar
        run: |
          JAR=$(find paper/build/libs -name "ZellysNexus-*.jar" \
                ! -name "*-javadoc*" ! -name "*-sources*" | head -1)
          FILE_SIZE=$(ls -lh "$JAR" | awk '{print $5}')
          echo "path=$JAR" >> "$GITHUB_OUTPUT"
          echo "name=$(basename $JAR)" >> "$GITHUB_OUTPUT"
          echo "size=$FILE_SIZE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        id: gh_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version }}
          name: "Zellys Nexus ${{ inputs.version }}"
          body_path: build/reports/release-notes.md
          files: ${{ steps.jar.outputs.path }}
          draft: false
          prerelease: ${{ contains(inputs.version, 'SNAPSHOT') || contains(inputs.version, 'dev') || contains(inputs.version, 'alpha') || contains(inputs.version, 'beta') || contains(inputs.version, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: zellys-nexus-jar
          path: ${{ steps.jar.outputs.path }}
          retention-days: 1

      - name: Publish release step summary
        run: |
          cat << EOF >> "$GITHUB_STEP_SUMMARY"
          ## GitHub Release Created Successfully

          | Metric | Details |
          | :--- | :--- |
          | **Release Name** | \`Zellys Nexus ${{ inputs.version }}\` |
          | **Tag Name** | \`${{ inputs.version }}\` |
          | **Asset** | \`${{ steps.jar.outputs.name }}\` (\`${{ steps.jar.outputs.size }}\`) |
          | **Release URL** | [View Release](${{ steps.gh_release.outputs.url }}) |
          EOF

  publish-artifacts:
    name: Publish Release Artifacts
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest
    outputs:
      jar_path: ${{ steps.jar.outputs.path }}
      version:  ${{ steps.jar.outputs.version }}
      channel:  ${{ steps.jar.outputs.channel }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build shadow JAR
        run: ./gradlew :paper:shadowJar --no-daemon

      - name: Locate JAR and resolve metadata
        id: jar
        run: |
          JAR=$(find paper/build/libs -name "ZellysNexus-*.jar" \
                ! -name "*-javadoc*" ! -name "*-sources*" | head -1)
          VERSION=$(basename "$JAR" .jar | sed 's/^ZellysNexus-//')

          if echo "$VERSION" | grep -qiE 'snapshot|alpha|dev|nightly|wip'; then
            CHANNEL="alpha"
          elif echo "$VERSION" | grep -qiE 'beta|rc'; then
            CHANNEL="beta"
          else
            CHANNEL="release"
          fi

          FILE_SIZE=$(ls -lh "$JAR" | awk '{print $5}')

          echo "path=$JAR"       >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "size=$FILE_SIZE"  >> "$GITHUB_OUTPUT"
          echo "Built: $JAR (version=$VERSION, channel=$CHANNEL, size=$FILE_SIZE)"

      - name: Upload published JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: ZellysNexus-publish-${{ steps.jar.outputs.version }}
          path: ${{ steps.jar.outputs.path }}
          retention-days: 30

      - name: Publish step summary
        run: |
          cat << EOF >> "$GITHUB_STEP_SUMMARY"
          ## Zellys Nexus Release Published

          | Metric | Details |
          | :--- | :--- |
          | **Version** | \`${{ steps.jar.outputs.version }}\` |
          | **Channel** | \`${{ steps.jar.outputs.channel }}\` |
          | **Artifact Path** | \`${{ steps.jar.outputs.path }}\` |
          | **Artifact Size** | \`${{ steps.jar.outputs.size }}\` |
          | **Event** | \`${{ github.event_name }}\` |
          EOF
