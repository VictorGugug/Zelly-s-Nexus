name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0 or 0.1.0-alpha)"
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build & Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version changelog
        id: changelog
        run: |
          python3 .github/scripts/generate_version_commits.py --version "${{ github.event.inputs.version }}" --release-body --output-file build/reports/release-notes.md

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build shadow JAR
        run: ./gradlew :paper:shadowJar --no-daemon

      - name: Locate JAR
        id: jar
        run: |
          JAR=$(find paper/build/libs -name "ZellysNexus-*.jar" \
                ! -name "*-javadoc*" ! -name "*-sources*" | head -1)
          FILE_SIZE=$(ls -lh "$JAR" | awk '{print $5}')
          echo "path=$JAR" >> "$GITHUB_OUTPUT"
          echo "name=$(basename $JAR)" >> "$GITHUB_OUTPUT"
          echo "size=$FILE_SIZE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        id: gh_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: "Zellys Nexus ${{ github.event.inputs.version }}"
          body_path: build/reports/release-notes.md
          files: ${{ steps.jar.outputs.path }}
          draft: false
          prerelease: ${{ contains(github.event.inputs.version, 'SNAPSHOT') || contains(github.event.inputs.version, 'dev') || contains(github.event.inputs.version, 'alpha') || contains(github.event.inputs.version, 'beta') || contains(github.event.inputs.version, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: zellys-nexus-jar
          path: ${{ steps.jar.outputs.path }}
          retention-days: 1

      - name: Publish release step summary
        run: |
          cat << EOF >> "$GITHUB_STEP_SUMMARY"
          ## GitHub Release Created Successfully

          | Metric | Details |
          | :--- | :--- |
          | **Release Name** | \`Zellys Nexus ${{ github.event.inputs.version }}\` |
          | **Tag Name** | \`${{ github.event.inputs.version }}\` |
          | **Asset** | \`${{ steps.jar.outputs.name }}\` (\`${{ steps.jar.outputs.size }}\`) |
          | **Release URL** | [View Release](${{ steps.gh_release.outputs.url }}) |
          EOF
